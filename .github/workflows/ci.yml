# Continuous integration for PDFStream.NET.
#
# On every push and pull request this workflow builds the solution, runs the tests for both target
# frameworks (net8.0-windows and net10.0-windows), packs the NuGet package and publishes the test-print
# sample as one self-contained exe. The package and the sample are only kept as artifacts of the run:
# nothing is published to NuGet or anywhere else, and the workflow uses no secrets.
#
# Every command runs from the repository root, because global.json there switches "dotnet test" to
# Microsoft Testing Platform. That is why the test steps use --project and --framework (and never the
# old VSTest --filter option).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch, or a new commit on the same pull request, makes a run that is still going
# pointless, so it is cancelled. Runs for different refs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No usage data leaves the build: the .NET CLI and Microsoft Testing Platform both honour these.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test-pack:
    name: Build, test and pack (windows-latest)
    runs-on: windows-latest
    # A stuck print or test run (for example a printer dialog nobody can close) fails after 30 minutes instead of
    # holding a runner for GitHub's default of six hours.
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK builds both targets and runs the tests through Microsoft Testing Platform;
          # the .NET 8 install brings the runtime the net8.0-windows tests run on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show the .NET SDK in use
        run: dotnet --version

      # Reports, never fails. Eight facade tests and the eight real-print tests need the
      # "Microsoft Print to PDF" printer and skip themselves (with a reason) when it is missing, so this
      # step and the skipped-test report below make a silent skip visible.
      - name: Report the printer the real-print tests need
        continue-on-error: true
        run: |
          try {
            $printer = Get-Printer -Name 'Microsoft Print to PDF' -ErrorAction SilentlyContinue
            if ($printer) {
              "Microsoft Print to PDF is installed on this runner (driver: $($printer.DriverName)). The tests that print to it will run."
            } else {
              "::warning title=Printer missing::Microsoft Print to PDF is not installed on this runner. The facade and real-print tests that need it will be skipped; see the skipped-test report."
            }
            $spooler = Get-Service -Name Spooler -ErrorAction SilentlyContinue
            "Print Spooler service: $(if ($spooler) { $spooler.Status } else { 'not found' })"
          } catch {
            "::warning title=Printer check failed::Could not check the printers: $($_.Exception.Message)"
          }
          exit 0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (net8.0-windows)
        run: >-
          dotnet test --project tests/PDFStream.NET.Tests/PDFStream.NET.Tests.csproj
          --framework net8.0-windows --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename net8.0-windows.trx

      - name: Test (net10.0-windows)
        run: >-
          dotnet test --project tests/PDFStream.NET.Tests/PDFStream.NET.Tests.csproj
          --framework net10.0-windows --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename net10.0-windows.trx

      # Reports, never fails: counts the skipped tests in each framework's results and lists them with
      # the reason each test gave, in the log and on the run's summary page.
      - name: Report skipped tests
        if: always()
        continue-on-error: true
        run: |
          try {
            $lines = @('### Test results', '')
            $files = @(Get-ChildItem artifacts/test-results -Filter *.trx -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { $lines += 'No test result files were found.' }
            foreach ($file in $files) {
              [xml]$trx = Get-Content $file.FullName -Raw
              $results = @($trx.TestRun.Results.UnitTestResult)
              $passed = @($results | Where-Object { $_.outcome -eq 'Passed' }).Count
              $failed = @($results | Where-Object { $_.outcome -eq 'Failed' }).Count
              $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
              $lines += "**$($file.BaseName)**: $($results.Count) tests, $passed passed, $failed failed, $($skipped.Count) skipped"
              foreach ($test in $skipped) {
                $reason = "$($test.Output.StdOut)".Trim()
                $lines += "- skipped: $($test.testName)$(if ($reason) { " ($reason)" })"
              }
              if ($skipped.Count -gt 0) { "::warning title=Skipped tests::$($skipped.Count) tests were skipped on $($file.BaseName)." }
              $lines += ''
            }
            $lines | ForEach-Object { $_ }
            if ($env:GITHUB_STEP_SUMMARY) { $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          } catch {
            "::warning title=Skipped-test report failed::$($_.Exception.Message)"
          }
          exit 0

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Pack the NuGet package
        run: dotnet pack src/PDFStream.NET/PDFStream.NET.csproj --configuration Release --no-build --output artifacts/package

      # Fails the run if the package lost its licence, notices, package readme, icon, metadata or PDFium dependency,
      # carries the wrong version or readme, or picked up a file type that has no business in it (keys,
      # certificates, settings, scripts). The checks live in one script that the publish workflow runs as well,
      # so a package can only be published if it passes exactly these checks.
      - name: Check the package contents
        run: ./.github/scripts/check-package.ps1 -PackageFolder artifacts/package

      - name: Upload the NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: PDFStream.NET-nuget-package
          path: artifacts/package
          if-no-files-found: error

      # One exe that includes the .NET runtime and pdfium.dll, so a person can double-click it on a
      # machine without .NET installed. Not trimmed: the settings reader relies on reflection.
      - name: Publish the test-print sample (win-x64, self-contained, single file)
        run: >-
          dotnet publish samples/PDFStream.NET.TestPrint/PDFStream.NET.TestPrint.csproj
          --framework net10.0-windows --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded
          -p:PublishDocumentationFiles=false
          --output artifacts/testprint

      - name: Upload the test-print sample
        uses: actions/upload-artifact@v7
        with:
          name: PDFStream.NET.TestPrint-win-x64
          path: artifacts/testprint
          if-no-files-found: error
